name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Front end (no LLVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake flex bison g++ python3
      - name: Configure
        run: cmake -S . -B build -DNDLANG_WITH_LLVM=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  llvm:
    name: With LLVM backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake flex bison g++ python3 clang llvm-18-dev libzstd-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
      - name: Build
        run: cmake --build build -j
      - name: Test (includes compiling and running every example natively)
        run: ctest --test-dir build --output-on-failure
