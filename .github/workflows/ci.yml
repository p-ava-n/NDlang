name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Front end (no LLVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake flex bison g++ python3
      - name: Configure
        run: cmake -S . -B build -DNDLANG_WITH_LLVM=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  llvm:
    name: With LLVM backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake flex bison g++ python3 clang llvm-18-dev libzstd-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
      - name: Build
        run: cmake --build build -j
      - name: Test (includes compiling and running every example natively)
        run: ctest --test-dir build --output-on-failure
      - name: Explorer server tests (web/)
        run: node --test web/test
      - name: Cross-compile to AArch64 (NDLANG_ALL_TARGETS build)
        run: |
          cmake -S . -B build-all -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm -DNDLANG_ALL_TARGETS=ON -DNDLANG_BUILD_TESTS=OFF
          cmake --build build-all -j --target ndlangc
          build-all/ndlangc examples/02_dot_product.ndlang --target aarch64-linux-gnu -O2 -o dot_arm.o
          file dot_arm.o | grep -q aarch64
      - name: Dump optimisation IR and run benchmark (for docs/optimization-demo.md)
        run: |
          mkdir -p opt-demo
          cd opt-demo
          for o in 0 1 2; do
            ../build/ndlangc ../examples/02_dot_product.ndlang --emit-ir -O$o -o dot_O$o.ll
          done
          for o in 0 2; do
            ../build/ndlangc ../benchmarks/bench_dot.ndlang --emit-ir -O$o -o bench_O$o.ll
          done
          diff -u dot_O0.ll dot_O1.ll > dot_O0_vs_O1.diff || true
          diff -u dot_O1.ll dot_O2.ll > dot_O1_vs_O2.diff || true
          diff -u bench_O0.ll bench_O2.ll > bench_O0_vs_O2.diff || true
          { uname -a; nproc; grep -m1 'model name' /proc/cpuinfo; llvm-config-18 --version || true; } > machine.txt
          python3 ../scripts/benchmark.py ../build/ndlangc --runs 5 | tee benchmark.txt
      - name: Upload optimisation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-demo
          path: opt-demo/
