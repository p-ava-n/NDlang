<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NDLang Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M3 4l4 4-4 4' stroke='%23fff' stroke-width='2' fill='none'/%3E%3Crect x='8' y='11' width='5' height='2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="pipeline" class="pipeline" aria-label="compiler pipeline"></nav>

  <div class="actions">
    <button type="button" id="btn-run" class="primary" title="Run every remaining stage (Ctrl+Enter)">run ▸▸</button>
    <button type="button" id="btn-step" title="Run the next stage only (Ctrl+Shift+Enter)">step ▸|</button>
    <span id="note" class="dim"></span>
    <span class="spacer"></span>
    <span id="nav-slot" class="nav"></span>
  </div>

  <main id="view"></main>

  <script type="module" src="app.js"></script>
</body>
</html>
