<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NDLang Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath d='M3 4l4 4-4 4' stroke='%23fff' stroke-width='2' fill='none'/%3E%3Crect x='8' y='11' width='5' height='2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">ndlang<span class="dim">:// explorer</span></span>
    <span id="target" class="dim"></span>
    <span class="spacer"></span>
    <span class="seg" role="group" aria-label="optimization level">
      <span class="dim">opt</span>
      <button type="button" data-opt="1" title="mem2reg, instcombine, simplifycfg, SLP vectorizer">-O1</button>
      <button type="button" data-opt="2" title="LLVM's default -O2 pipeline">-O2</button>
    </span>
    <button type="button" id="btn-step" title="Run the next stage only (Ctrl+Shift+Enter)">step ▸|</button>
    <button type="button" id="btn-run" class="primary" title="Run every stage (Ctrl+Enter)">run ▸▸</button>
  </header>

  <nav id="pipeline" class="pipeline" aria-label="compiler pipeline"></nav>

  <main id="view"></main>

  <footer id="status" class="status"></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
